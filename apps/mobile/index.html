<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Video Editor</title>
    <!-- No webmanifest/favicon needed here; the native OS provides the app icon -->
    <meta name="theme-color" content="#863bff" />
    
    <!-- Set the theme before first paint to prevent flashes. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('editor-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
